name: Kariyer Data Sync

# Kariyer günlük taraması:
#  - Resmî Gazete günlük sayıları (bilişim/personel-alımı sinyalleri)
# Her sabah koşar; scraper idempotent + merge'li, değişiklik yoksa commit atmaz.
# Boş/şüpheli sonuçta write_json_guarded exit 1 döner → kırmızı workflow,
# dosya korunur (KPSS [] faciası tekrarlanmaz). Push → Render autodeploy.

on:
  schedule:
    # Her gün 05:00 UTC (RG sayıları sabaha karşı netleşir)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Kariyer taramasi (Resmi Gazete gunluk sayilari)
        working-directory: backend
        run: python -m unisense.infrastructure.scrapers.kariyer_scraper

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/processed/kariyer_ilanlar.json
          if git diff --staged --quiet; then
            echo "Kariyer verisi güncel — commit yok"
          else
            git commit -m "chore(data): Kariyer gunluk tarama ($(date -u +%Y-%m-%d))"
            git push
          fi
