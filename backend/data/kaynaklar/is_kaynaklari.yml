# Kaynak kayıt defteri — KOD DEĞİL VERİ.
# Yeni kaynak = bu dosyaya girdi + scrapers/kariyer/<kod>.py adaptörü (desen: F0.4).
# erisim: api | rss | sitemap | html | toleransli | yok
# aktif: false olan kaynak koşuda atlanır (silinmez — URL doğrulaması bekleyenler).
kaynaklar:
  - kod: rg
    ad: Resmî Gazete
    hat: kamu
    url: https://www.resmigazete.gov.tr/
    erisim: html
    aktif: true
    not: Günlük sayı PDF'leri + bilişim/personel-alımı sinyal taraması.
    params:
      max_pdf_mb: 64

  - kod: kamuilan
    ad: kamuilan.sbb.gov.tr
    hat: kamu
    url: https://kamuilan.sbb.gov.tr/
    erisim: html
    aktif: true
    not: WebForms postback (boş arama) + timeline parse; güncel kamu ilanları.

  - kod: kariyerkapisi
    ad: Kariyer Kapısı
    hat: kamu
    url: https://kariyerkapisi.gov.tr/RSS
    erisim: rss
    aktif: true
    not: Girişsiz RSS (33 ilan); category → istihdam, "KURUM - başlık" → kurum.

  - kod: akademiktr
    ad: AkademikTR
    hat: kamu
    url: https://akademiktr.com/ilan
    erisim: html
    aktif: true
    not: Akademik kadro toplayıcısı (ilan.yok.gov.tr ölü); kategori + detay SSR.

  - kod: ilangovtr
    ad: ilan.gov.tr
    hat: kamu
    url: https://www.ilan.gov.tr/ilan/tum-ilanlar/personel-alimi?ats=5
    erisim: api
    aktif: true
    not: BİK API (sorting "id desc" şart); PERSONEL ALIMI yerelde süzülür; sayfa tavanı 20.

  - kod: savunmakariyer
    ad: Savunma Kariyer (eski Vizyoner Genç)
    hat: kamu
    url: https://savunmakariyer.com/ilanlar
    erisim: api
    aktif: true
    not: Herkese açık jobs API (auth yok); ACTIVITY atlanır; KPSS'siz savunma ilanları.

  - kod: turksat
    ad: TÜRKSAT Kariyer
    hat: kamu
    url: https://kariyer.turksat.com.tr/jobs
    erisim: html
    aktif: true
    not: SSR tablo (şu an 0 açık pozisyon); yapı hazır, ilan çıkınca akar.

  - kod: iskur
    ad: İŞKUR e-Şube
    hat: kamu
    url: https://esube.iskur.gov.tr/
    erisim: yok
    aktif: false
    not: WAF her şeyi reddediyor (robots.txt dahil); liste aynası yok (MEB aynası yalnız meslek kılavuzu). Toplayıcılarda 0 İŞKUR kaydı ölçüldü.

  - kod: jooble
    ad: Jooble
    hat: ozel
    url: https://tr.jooble.org
    erisim: api
    aktif: true
    env_key: JOOBLE_API_KEY
    not: Toplayıcı API (ülke subdomaini şart). Anahtar yoksa atlanır.
    sorgular:
      - {keywords: "mühendis", location: "Türkiye"}
      - {keywords: "yazılım", location: "Türkiye"}
      - {keywords: "teknik", location: "Türkiye"}
      - {keywords: "bilgisayar", location: "Türkiye"}
      - {keywords: "sağlık", location: "Türkiye"}
      - {keywords: "öğretmen", location: "Türkiye"}
      - {keywords: "muhasebe", location: "Türkiye"}
      - {keywords: "satış", location: "Türkiye"}
      - {keywords: "hukuk", location: "Türkiye"}
      - {keywords: "lojistik", location: "Türkiye"}
    sayfa: 5

  - kod: careerjet
    ad: Careerjet
    hat: ozel
    url: https://www.careerjet.com.tr
    erisim: api
    aktif: true
    env_key: CAREERJET_API_KEY
    not: Toplayıcı API (locale tr_TR). Anahtar yoksa atlanır.
    sorgular:
      - "mühendis"
      - "yazılım"
      - "tekniker"
      - "sağlık"
      - "öğretmen"
      - "muhasebe"
      - "satış"
    sayfa: 3
