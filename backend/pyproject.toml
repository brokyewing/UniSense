[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unisense-backend"
version = "0.1.0"
description = "UniSense — Üniversite tercih asistanı (RAG + sıralama veritabanı)"
requires-python = ">=3.11"
authors = [{name = "BrokyEwing"}]
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "chromadb>=0.4.24",
    "numpy>=1.26.0",
    "tokenizers>=0.19.0",
    "huggingface_hub>=0.23.0",
    "google-generativeai>=0.8.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tqdm>=4.66.0",
    "PyMuPDF>=1.24.0",
    "pandas>=2.2.0",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
# Yalnız scraper'ların (yokatlas_scraper / yokatlas_extra_scraper / probe_dgs)
# ihtiyaç duyduğu paketler. Runtime'a GİRMEZ: prod imajı requirements.txt +
# `pip install -e . --no-deps` ile kurulduğu için buradakiler Render'a inmez.
# Yearly YKS Data Sync workflow'u `pip install -e ".[scrape]"` ile kurar.
scrape = [
    "yokatlas-py>=0.6.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
unisense-api = "unisense.main:run"
unisense-cli = "unisense.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["unisense*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# NOT: `select` bilincli olarak YAZILMADI. Aile bazinda secmek (ör. "RUF")
# varsayilanda olmayan kurallari da aciyor — denendi: RUF001/002/003 tek
# basina 3774 bulgu uretti (Turkce metindeki karakterleri "belirsiz" sayiyor).
# Bu yuzden ruff'in varsayilan seti korunuyor; asagida yalnizca BILINCLI
# istisnalar listeleniyor. Varsayilan set surumle degisebilir (0.16 tam bunu
# yapti) — haftalik CI cron'u (ci.yml) bunu bir hafta icinde gorunur kilar.
[tool.ruff.lint]
ignore = [
    # SIM115: `json.load(open(p))` — acilista okunan kucuk JSON'lar. 35 cagri
    # noktasi; context manager'a cevirmek servis kodunda genis yeniden yazim.
    # Ayri is olarak .beyin/GOREVLER.md'de duruyor.
    "SIM115",
    # BLE001 / S110 / S112: scraper ve RAG katmaninda `except Exception` +
    # pass/continue BILINCLI dayaniklilik — tek bir il/PDF/chunk patlayinca tum
    # kosu durmasin. Kod zaten yer yer `# noqa: BLE001` ile isaretlemis.
    "BLE001", "S110", "S112",
    # DTZ011: `date.today()` yerel saati kullanir. UTC'ye cevirmek Turkiye'de
    # (UTC+3) 00:00-03:00 arasi gunu KAYDIRIR — davranis degisikligi, urun
    # karari gerektirir. Europe/Istanbul'a gecirilecekse ayrica ele alinmali.
    "DTZ011",
    # TRY004: bozuk yapilandirmada TypeError onerir; kod bilincli olarak
    # ValueError firlatiyor ve testler bunu bekliyor (test_kariyer.py:349,353).
    # Tip degistirmek genel sozlesmeyi kirar.
    "TRY004",
]

[tool.ruff.lint.flake8-bugbear]
# B008: FastAPI'de `Depends(...)` argüman varsayilaninda cagrilir; deyimsel ve
# dogru kullanim — kural disi birakiliyor, kod degistirilmiyor.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Body", "fastapi.Path", "fastapi.Form",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
